
name: QuickChat Java Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: Compile and Run JUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download JUnit Platform Console
        run: |
          curl -fL \
            https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar \
            -o junit-platform-console-standalone.jar

      - name: Compile Java source and test files
        run: |
          mkdir -p out
          find src -type f -name "*.java" -print0 | \
            xargs -0 javac \
              -cp junit-platform-console-standalone.jar \
              -d out

      - name: Run JUnit Tests
        run: |
          java -jar junit-platform-console-standalone.jar execute \
            --class-path out \
            --scan-class-path \
            --fail-if-no-tests
